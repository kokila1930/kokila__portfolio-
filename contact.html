<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+VN:wght@100..400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="section-one">
        <h1 class="section-one__name">KOKILA</h1>
        <p class="section-one__role">Web developer</p>
        <a href="index.html" class="section-one__contact">🛖 home</a>   
    </div>
    <div class="contact-form">
    <form>
        <table>
            <tr>
                <td>Name:</td>
                <td>
                    <input type="text" placeholder="enter your name" class="contact-form__input">
                </td>
            </tr>
            <tr>
                <td>Email:</td>
                <td>
                    <input type="email" placeholder="enter your email id" class="contact-form__input">
                </td>
            </tr>
            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" placeholder="enter your password" class="contact-form__input">
                </td>
            </tr>
            <tr>
                <td>Message:</td>
                <td>
                    <textarea placeholder="enter your msg.." class="contact-form__textarea"></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" class="contact-form__submit">
                </td>
            </tr>
        </table>
    </form>
    </div>
    <div class="footer">
        <p class="footer__t">social media:
            <a href="#">insta</a>
            <a href="#">linkdin</a>
        </p>
        <p class="footer__d">&copy; Kokila</p>
   </div>
  </div>
</body>
</html>
